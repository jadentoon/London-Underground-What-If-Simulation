services:
  neo4j-test:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  all-tests:
    image: node:22-alpine
    working_dir: /workspace
    depends_on:
      neo4j-test:
        condition: service_healthy
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - frontend_node_modules:/workspace/frontend/tfl-what-if-simulation/node_modules
    environment:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      RUN_NEO4J_TESTS: "true"
      NEO4J_URI: bolt://neo4j-test:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    command: >
      sh -c "
        set -e;

        echo 'Running root tests...';
        npm ci;
        node scripts/seed-test-neo4j.js;
        npm test -- --testPathIgnorePatterns=frontend/tfl-what-if-simulation;

        echo 'Running frontend tests...';
        cd frontend/tfl-what-if-simulation;
        npm ci;
        npm test;

        echo 'All test suites passed.'
      "

volumes:
  root_node_modules:
  frontend_node_modules:
