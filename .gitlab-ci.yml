stages:
  - test

variables:
  FF_NETWORK_PER_BUILD: "1"
  NEO4J_AUTH: "neo4j/password"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "password"
  RUN_NEO4J_TESTS: "true"
  NEXT_TELEMETRY_DISABLED: "1"

test:
  stage: test
  image: node:22
  services:
    - name: neo4j:5
      alias: neo4j
  before_script:
    - apt-get update
    - apt-get install -y netcat-openbsd
    - echo "Waiting for Neo4j to accept connections..."
    - for i in $(seq 1 30); do nc -z neo4j 7687 && break; sleep 2; done
    - sleep 5
  script:
    - echo "Running root tests..."
    - npm ci
    - node scripts/seed-test-neo4j.js
    - npm test -- --testPathIgnorePatterns=frontend/tfl-what-if-simulation
    - echo "Running frontend tests..."
    - cd frontend/tfl-what-if-simulation
    - npm ci
    - npm test
