services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ./frontend/tfl-what-if-simulation
      target: dev
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/tfl-what-if-simulation:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    command: npm run dev -- --hostname 0.0.0.0
  db-seed:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    command: sh -c "npm install && npm run db:build"

volumes:
  neo4j_data:
  root_node_modules:
  frontend_node_modules:
  frontend_next:
