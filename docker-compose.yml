services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
  frontend:
    build:
      context: ./frontend/tfl-what-if-simulation
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/tfl-what-if-simulation:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  frontend_node_modules:
  frontend_next:
